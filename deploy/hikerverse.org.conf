<VirtualHost *:80>
    ServerName hikerverse.org
    Redirect permanent / https://hikerverse.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName hikerverse.org

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/hikerverse.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hikerverse.org/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/hikerverse.org-error.log
    CustomLog ${APACHE_LOG_DIR}/hikerverse.org-access.log combined
</VirtualHost>
